services:
  app:
    build: .
    container_name: php848
    working_dir: /var/www/
    volumes:
      - ./:/var/www
    networks:
      - calendario-network

  db:
    image: mysql:9.3
    container_name: mysql93
    ports:
      - "3393:3393"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    env_file:
      - ./.env
    networks:
      - calendario-network
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - 8010:80
    volumes:
      - ./App:/var/www
      - ./default.conf/:/etc/nginx/conf.d/default.conf
    networks:
      - calendario-network

networks:
  calendario-network:
    driver: bridge